<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>标幺值换算器</title>
<style>
  :root { --bg:#141a1f; --panel:#1c242b; --line:#2c3842; --ink:#e7eef2; --muted:#93a3ae; --accent:#4aa3ff; --ok:#2fbf8f; --warn:#f2a33a; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: var(--bg); color: var(--ink); font: 14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  h2 { margin: 0 0 4px; font-size: 17px; }
  p.sub { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  label b { color: var(--ink); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 8px 0 14px; }
  .formula { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--muted); margin: 6px 0; }
  .big { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--ok), var(--accent)); transition: width .3s ease; }
  .hint { margin-top: 10px; font-size: 12px; color: var(--warn); }
</style>
</head>
<body>
  <h2>⚡ 标幺值换算器</h2>
  <p class="sub">拖动滑块：选定基准容量 S<sub>B</sub> 与基准电压 U<sub>B</sub>，看同一个有名值阻抗如何换算成标幺值。</p>

  <div class="grid">
    <div class="card">
      <label>基准容量 S<sub>B</sub> <b id="sbv">100 MVA</b></label>
      <input id="sb" type="range" min="10" max="1000" step="10" value="100">
      <label>基准电压 U<sub>B</sub> <b id="ubv">110 kV</b></label>
      <input id="ub" type="range" min="10" max="500" step="5" value="110">
      <label>有名值阻抗 Z <b id="zv">40 Ω</b></label>
      <input id="z" type="range" min="1" max="200" step="1" value="40">
    </div>

    <div class="card">
      <div class="formula">Z<sub>B</sub> = U<sub>B</sub>² / S<sub>B</sub></div>
      <div class="big" id="zb">121.0 Ω</div>
      <div class="formula" style="margin-top:12px">Z* = Z / Z<sub>B</sub></div>
      <div class="big" id="zpu">0.331</div>
      <div class="bar"><i id="bar"></i></div>
      <div class="hint" id="hint"></div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  function update() {
    const sb = +$("sb").value, ub = +$("ub").value, z = +$("z").value;
    const zb = ub * ub / sb, zpu = z / zb;
    $("sbv").textContent = sb + " MVA";
    $("ubv").textContent = ub + " kV";
    $("zv").textContent = z + " Ω";
    $("zb").textContent = zb.toFixed(1) + " Ω";
    $("zpu").textContent = zpu.toFixed(3);
    $("bar").style.width = Math.min(100, zpu * 100) + "%";
    $("hint").textContent = zpu > 1 ? "Z* > 1：阻抗比基准阻抗还大，检查基准电压是否选在了正确的电压等级。" : "";
  }
  ["sb", "ub", "z"].forEach((id) => $(id).addEventListener("input", update));
  update();
</script>

<script data-komorebi-widget>(function(){function r(){var b=document.body,d=document.documentElement;var h=Math.ceil(Math.max(b?b.scrollHeight:0,b?b.getBoundingClientRect().height:0,d.getBoundingClientRect().height));parent.postMessage({type:"komorebi-widget-height",height:h},"*")}addEventListener("load",r);addEventListener("resize",r);if(window.ResizeObserver){var o=new ResizeObserver(r);o.observe(document.documentElement);if(document.body)o.observe(document.body)}setTimeout(r,300);setTimeout(r,1500)})();</script>
</body>
</html>
